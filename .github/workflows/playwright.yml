# ITNOA
# Playwright enables reliable web automation for testing, scripting, and AI agents.
#
# One API to drive Chromium, Firefox, and WebKit — in your tests, your scripts, and your agent workflows.
# These are the .NET (NUnit) system tests: Tests/WebApps/TimeManagement.BlazorWebApp.SystemTests
name: Playwright Tests for TimeManagement Project
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'Source/ClientApps/**'
      - 'Tests/ClientApps/**'
      - '.github/workflows/pr-validation-maui.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'Source/ClientApps/**'
      - 'Tests/ClientApps/**'
      - '.github/workflows/pr-validation-maui.yml'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET (global.json)
      uses: actions/setup-dotnet@v6
    - name: Build
      run: dotnet build Tests/WebApps/TimeManagement.BlazorWebApp.SystemTests/TimeManagement.BlazorWebApp.SystemTests.csproj
    - name: Install Playwright Browsers
      # UseArtifactsOutput=true (Directory.Build.props) puts the generated playwright.ps1
      # under artifacts/bin/<project>/debug instead of bin/Debug/net10.0.
      run: pwsh artifacts/bin/TimeManagement.BlazorWebApp.SystemTests/debug/playwright.ps1 install --with-deps chromium
    - name: Run Playwright tests
      run: dotnet test Tests/WebApps/TimeManagement.BlazorWebApp.SystemTests/TimeManagement.BlazorWebApp.SystemTests.csproj --no-build --no-progress --output detailed