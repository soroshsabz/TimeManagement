# ITNOA
# Playwright enables reliable web automation for testing, scripting, and AI agents.
#
# One API to drive Chromium, Firefox, and WebKit — in your tests, your scripts, and your agent workflows. Available for TypeScript, Python, .NET, and Java.
name: Playwright Tests for TimeManagement Project
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'Source/ClientApps/**'
      - 'Tests/ClientApps/**'
      - '.github/workflows/pr-validation-maui.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'Source/ClientApps/**'
      - 'Tests/ClientApps/**'
      - '.github/workflows/pr-validation-maui.yml'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install .NET HTTPS Development Certificate
      # if: matrix.os == 'ubuntu-latest'
      run: |
        dotnet dev-certs https --clean
        dotnet dev-certs https --trust
    - name: Install Playwright Browsers
      run: npx playwright install chromium
    - name: Run Playwright tests
      run: npx playwright test
      env:
        ESHOP_USE_HTTP_ENDPOINTS: 1
        USERNAME1: bob
        PASSWORD: Pass123$
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30